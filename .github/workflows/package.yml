name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      # Use setup-python's interpreter, not the development helper's py -3.12 fallback.
      QST_PYTHON_EXECUTABLE: python
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: macos
            arch: arm64
            target: mac
          - runner: windows-latest
            os: windows
            arch: x64
            target: win
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: ${{ matrix.arch }}
      - name: Verify native runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, '${{ matrix.arch }}')"
      - run: npm ci
      - run: python -m pip install -e "services/quant-engine[dev]"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Builds native Python, builds electron-vite, creates installer, verifies resources,
      # smokes engine + application/OCR/relaunch, then creates checksums. Never publishes.
      - run: npm run package:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: QuantScreenTrader-0.1.0-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/QuantScreenTrader-*.dmg
            release/QuantScreenTrader-*.exe
            release/SHA256SUMS.txt
            release/package-manifest.json
            release/package-files.txt
